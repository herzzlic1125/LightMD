<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightMD 阅读界面预览</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .menu-bar { height: 28px; display: flex; align-items: center; gap: 25px; padding: 0 14px; border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, Canvas); background: color-mix(in srgb, CanvasText 4%, Canvas); font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    .menu-bar small { margin-left: auto; color: color-mix(in srgb, CanvasText 48%, Canvas); }
    .mac-titlebar { height: 48px; display: flex; align-items: flex-start; padding: 13px 14px; gap: 8px; position: relative; }
    .mac-titlebar i { display: block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #0002; }
    .mac-titlebar i:nth-child(1) { background: #ff5f57; }
    .mac-titlebar i:nth-child(2) { background: #febc2e; }
    .mac-titlebar i:nth-child(3) { background: #28c840; }
    .capsule-controls { position: absolute; right: 14px; top: 8px; width: 70px; height: 26px; display: flex; align-items: stretch; overflow: hidden; border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 999px; background: Canvas; }
    .titlebar-toggle { width: 34px; height: 24px; border: 0; background: transparent; color: CanvasText; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .14s ease, transform .14s ease; }
    .titlebar-toggle:hover { background: color-mix(in srgb, CanvasText 6%, Canvas); }
    .titlebar-toggle:active { background: color-mix(in srgb, CanvasText 12%, Canvas); transform: scale(.92); }
    .titlebar-toggle svg { display: block; width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .mode-toggle .book-icon, .mode-toggle.editing-mode .split-icon { display: none; }
    .mode-toggle.editing-mode .book-icon { display: block; }
    .titlebar-name { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: min(360px, 40vw); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 600; }
    .tabs { min-height: 30px; display: flex; align-items: stretch; overflow-x: auto; border-bottom: 1px solid color-mix(in srgb, CanvasText 13%, transparent); }
    .tab { display: flex; align-items: center; gap: 5px; padding: 0 9px; flex: none; font-size: 13px; color: color-mix(in srgb, CanvasText 55%, Canvas); transition: color .12s ease-out; }
    .tab:hover { color: CanvasText; }
    .tab.active { color: CanvasText; border-bottom: 2px solid CanvasText; }
    .tab button { border: 0; background: transparent; padding: 0; }
    .tab .close { opacity: 0; visibility: hidden; font-size: 11px; transition: opacity .12s ease-out; }
    .tab.active .close, .tab:hover .close, .tab:focus-within .close { opacity: .55; visibility: visible; }
    .new-tab { border: 0; background: transparent; padding: 0 8px; font-size: 14px; }
    .search-bar { height: 35px; display: flex; align-items: center; gap: 9px; padding: 0 14px; border-bottom: 1px solid color-mix(in srgb, CanvasText 13%, Canvas); background: color-mix(in srgb, CanvasText 4%, Canvas); font: 12px -apple-system, BlinkMacSystemFont, sans-serif; }
    .search-bar[hidden] { display: none; }
    .search-bar input { width: min(300px, 44vw); background: transparent; color: inherit; border: none; outline: none; font: inherit; }
    .search-bar button { border: 0; background: transparent; padding: 3px 5px; }
    .search-bar button:hover { background: color-mix(in srgb, CanvasText 8%, Canvas); border-radius: 4px; }
    .search-count { min-width: 34px; color: color-mix(in srgb, CanvasText 55%, Canvas); }
    .file-path { height: 26px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid color-mix(in srgb, CanvasText 13%, transparent); color: color-mix(in srgb, CanvasText 60%, Canvas); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-path[hidden] { display: none; }
    .reading-area { position: relative; height: calc(100vh - 106px - var(--path-height, 26px) - var(--search-height, 0px)); min-height: 320px; overflow: hidden; }
    .source-pane { position: absolute; inset: 0 auto 0 0; width: var(--split-left, 40%); background: Canvas; overflow: hidden; transform: translateX(-100%); transition: transform .28s ease-in-out; pointer-events: none; }
    .reading-area.editing .source-pane { transform: translateX(0); pointer-events: auto; }
    .source-pane textarea { width: 100%; height: 100%; resize: none; border: none; outline: none; padding: 18px 16px; background: Canvas; color: CanvasText; font: 14px/1.5 ui-monospace, SFMono-Regular, monospace; overflow: auto; white-space: pre-wrap; }
    .split-divider { position: absolute; z-index: 3; top: 0; bottom: 0; left: -14px; width: 14px; opacity: 0; transition: left .28s ease-in-out, opacity .28s ease-in-out; cursor: col-resize; touch-action: none; pointer-events: none; }
    .split-divider::before { content: ''; position: absolute; inset: 0 auto 0 6.5px; width: 1px; background: color-mix(in srgb, CanvasText 20%, Canvas); }
    .reading-area.editing .split-divider { left: var(--split-left, 40%); opacity: 1; pointer-events: auto; }
    .reading-area.transitioning .source-pane, .reading-area.transitioning .split-divider { pointer-events: none; }
    .reading-area.dragging .document-scroll, .reading-area.dragging .split-divider { transition: none; }
    .outline { position: absolute; z-index: 2; right: 0; top: 0; width: 221px; height: 100%; background: Canvas; }
    .reading-area.collapsed .outline { pointer-events: none; }
    .outline-inner { width: 221px; height: 100%; border-left: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); display: flex; flex-direction: column; }
    .outline-title { padding: 12px 14px; border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); font-size: 13px; font-weight: 600; }
    .outline-list { overflow-y: auto; padding: 6px 10px; }
    .outline-list button { display: block; width: 100%; padding: 7px 4px; text-align: left; border: 0; background: transparent; font-size: 12px; }
    .outline-list button:hover { background: color-mix(in srgb, CanvasText 7%, Canvas); }
    .document-scroll { position: absolute; inset: 0 auto 0 0; width: var(--preview-width, 100%); left: var(--preview-left, 0%); overflow-y: auto; overflow-x: hidden; }
    .page { width: 760px; margin: 0; padding: 18px 0; transform: translateX(0); font: 16px/1.55 "Songti SC", serif; }
    .page.blank { height: 100%; }
    .page > * { margin: 0 0 14px; }
    .page strong { font-family: "STSongti-SC-Black", serif; font-weight: 900; position: relative; top: .06em; }
    .page .latin, .page .digit { font-family: ui-serif, "New York", Georgia, serif; }
    .page .cjk-punct { font-family: SimSong, "Songti SC", serif; }
    .page strong .cjk-punct { font-family: "STSongti-SC-Black", "Songti SC", serif; }
    .page em { font-family: "Kaiti SC", "STKaitiSC-Regular", serif; }
    .page em .latin, .page em .digit { font-family: ui-serif, "New York", Georgia, serif; }
    .page h1 { font-size: 1.6em; line-height: 1.3; }
    .page h2 { font-size: 1.5em; line-height: 1.35; margin-top: 18px; }
    .page h3 { font-size: 1.25em; line-height: 1.35; margin-top: 16px; }
    .page .heading-num { font-family: ui-serif, "New York", Georgia, serif; font-weight: 600; }
    .page ol, .page ul { padding-left: 1.05em; }
    .page li { padding-left: .15em; margin-bottom: 10px; }
    .page blockquote { padding-left: 1em; border-left: 3px solid #888; color: color-mix(in srgb, CanvasText 70%, Canvas); }
    .page code { font-family: ui-monospace, SFMono-Regular, monospace; background: color-mix(in srgb, CanvasText 7%, Canvas); padding: .1em .25em; border-radius: 4px; }
    .page pre { overflow: auto; padding: 14px; background: color-mix(in srgb, CanvasText 7%, Canvas); border-radius: 8px; }
    .page a { color: #236ac5; }
    .page table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: .9em; overflow-wrap: anywhere; }
    .page th, .page td { padding: 8px; border: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); text-align: left; vertical-align: top; }
    .page th:nth-child(1), .page td:nth-child(1) { width: 19%; }
    .page th:nth-child(2), .page td:nth-child(2) { width: 32%; }
    .page th:nth-child(3), .page td:nth-child(3) { width: 49%; }
    .page th { background: color-mix(in srgb, CanvasText 5%, Canvas); }
    .page .plain-line { white-space: pre-wrap; overflow-wrap: anywhere; }
    .page .search-hit { background: #ffd94d44; }
    .source-mirror { position: absolute; left: -100000px; top: 0; visibility: hidden; pointer-events: none; padding: 18px 16px; font: 14px/1.5 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mirror-line { min-height: 21px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { height: 100%; display: grid; place-content: center; gap: 12px; text-align: center; color: color-mix(in srgb, CanvasText 55%, Canvas); }
    .empty .icon { font-size: 44px; }
    @media (prefers-reduced-motion: reduce) { .outline, .page, .source-pane, .split-divider, .document-scroll, .tab, .tab .close { transition: none; } }
  </style>
</head>
<body>
  <div class="menu-bar" aria-label="中文菜单示意"><strong>LightMD</strong><span>文件</span><span>编辑</span><span>显示</span><span>窗口</span><span>帮助</span><small>交互预览 · 自动保存仅演示状态，不写回文件</small></div>
  <div class="mac-titlebar"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><div class="capsule-controls"><button id="toggleMode" class="titlebar-toggle mode-toggle" title="切换到双栏编辑模式" aria-label="切换到双栏编辑模式"><svg class="split-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="2"/><path d="M8 2v16"/></svg><svg class="book-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4c-2-1.5-5-1.5-8-1v13c3-.5 6-.5 8 1 2-1.5 5-1.5 8-1V3c-3-.5-6-.5-8 1Z"/><path d="M10 4v13"/></svg></button><button id="toggleOutline" class="titlebar-toggle" title="显示或隐藏右侧目录" aria-label="显示或隐藏右侧目录" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="2"/><path d="M13 2v16"/></svg></button></div><span id="titleName" class="titlebar-name">阅读示例.md</span></div>
  <input id="file" type="file" accept=".md,.markdown,.mdown,.txt" multiple hidden>
  <nav class="tabs" id="tabs" aria-label="文档标签页"></nav>
  <div class="file-path" id="filePath">/Users/example/Documents/LightMD/阅读示例.md</div>
  <div class="search-bar" id="searchBar" hidden><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="在文档中查找" aria-label="在文档中查找"><span id="searchCount" class="search-count">0/0</span><button id="previousHit" title="上一个匹配">⌃</button><button id="nextHit" title="下一个匹配">⌄</button><button id="closeSearch" title="关闭查找">×</button></div>
  <div class="reading-area collapsed" id="readingArea">
  <div class="source-pane" id="sourcePane"><textarea id="sourceEditor" spellcheck="false" aria-label="Markdown 源码"></textarea></div>
  <div class="source-mirror" id="sourceMirror" aria-hidden="true"></div>
  <div class="split-divider" id="splitDivider" role="separator" aria-orientation="vertical" aria-label="调整源码和预览宽度"></div>
  <aside class="outline" id="outline"><div class="outline-inner"><div class="outline-title">目录</div><div class="outline-list" id="outlineList"></div></div></aside>
  <div class="document-scroll" id="documentScroll"><main class="page" id="page"><h1>LightMD 阅读示例</h1><p>打开文档，查看排版，或切换编辑模式。</p></main></div></div>
  <script>
    const page = document.getElementById('page');
    const tabsElement = document.getElementById('tabs');
    const fileInput = document.getElementById('file');
    const readingArea = document.getElementById('readingArea');
    const outlineList = document.getElementById('outlineList');
    const documentScroll = document.getElementById('documentScroll');
    const titleName = document.getElementById('titleName');
    const filePath = document.getElementById('filePath');
    const toggleMode = document.getElementById('toggleMode');
    const toggleOutline = document.getElementById('toggleOutline');
    const outline = document.getElementById('outline');
    const sourceEditor = document.getElementById('sourceEditor');
    const sourceMirror = document.getElementById('sourceMirror');
    const splitDivider = document.getElementById('splitDivider');
    const searchBar = document.getElementById('searchBar');
    const searchInput = document.getElementById('searchInput');
    const searchCount = document.getElementById('searchCount');
    let font = 16;
    let targetInset = 0;
    let visualInset = 0;
    let outlineFrame;
    const initialSource = ["# LightMD 阅读示例", "", "这是一份用于查看 Markdown 排版与编辑效果的示例文档。", "", "## 阅读与编辑", "", "正文支持 **粗体**、*斜体*、English 和 12345。", "", "1. 打开文档，查看排版。", "2. 切换编辑模式，调整左右宽度。", "", "### 常用功能", "", "| 功能 | 说明 | 操作 |", "| --- | --- | --- |", "| 阅读 | 查看文档 | 打开文件 |", "| 编辑 | 实时预览 | 切换模式 |"].join('\n');
    let tabs = [{ name: '阅读示例.md', path: '/Users/example/Documents/LightMD/阅读示例.md', source: initialSource,
                  savedSource: initialSource, html: render(initialSource) }];
    let active = 0;
    let mode = 'reading';
    let outlineBeforeEditing = false;
    let splitRatio = 0.4;
    let visualModeProgress = 0;
    let modeFrame;
    let modeTransitioning = false;
    let renderTimer;
    const autoSaveTimers = new WeakMap();
    let hits = [];
    let hitIndex = 0;
    function emptyHTML() { return '<div class="empty"><div class="icon">▤</div><div>打开 Markdown 文件</div><div>按 ⌘O 打开文件，或将 .md 文件拖到窗口中</div></div>'; }
    function drawTabs() {
      tabsElement.replaceChildren();
      tabs.forEach((tab, index) => {
        const item = document.createElement('div'); item.className = 'tab' + (index === active ? ' active' : '');
        const select = document.createElement('button'); select.textContent = tab.name + (tab.source !== tab.savedSource ? ' ●' : ''); select.onclick = () => { active = index; drawTabs(); drawPage(); };
        const close = document.createElement('button'); close.className = 'close'; close.textContent = '×'; close.title = '关闭标签页';
        close.onclick = () => { if (tab.source !== tab.savedSource && !confirm('这份文档尚未保存，仍要关闭标签页吗？')) return; tabs.splice(index, 1); if (!tabs.length) tabs = [{ name: '未命名', source: '', savedSource: '', html: '' }]; active = Math.min(active, tabs.length - 1); drawTabs(); drawPage(); };
        item.append(select, close); tabsElement.append(item);
      });
      const add = document.createElement('button'); add.className = 'new-tab'; add.textContent = '+'; add.title = '新建标签页 (⌘T)'; add.onclick = newTab; tabsElement.append(add);
    }
    function applyScriptFonts() {
      const walker = document.createTreeWalker(page, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (!node.parentElement.closest('code,pre,script,style')) nodes.push(node);
      }
      for (const node of nodes) {
        const parts = node.nodeValue.split(/([A-Za-zÀ-ÿ]+|[0-9]+|[，。：；「」（）《》？！～、．“”‘’【】]+)/g);
        if (parts.length === 1) continue;
        const fragment = document.createDocumentFragment();
        for (const part of parts) {
          if (!part) continue;
          if (/^[A-Za-zÀ-ÿ]+$/.test(part)) { const span = document.createElement('span'); span.className = 'latin'; span.textContent = part; fragment.append(span); }
          else if (/^[0-9]+$/.test(part)) { const span = document.createElement('span'); span.className = 'digit'; span.textContent = part; fragment.append(span); }
          else if (/^[，。：；「」（）《》？！～、．“”‘’【】]+$/.test(part)) { const span = document.createElement('span'); span.className = 'cjk-punct'; span.textContent = part; fragment.append(span); }
          else fragment.append(document.createTextNode(part));
        }
        node.replaceWith(fragment);
      }
    }
    function drawOutline() {
      outlineList.replaceChildren();
      const headings = [...page.querySelectorAll('h1,h2,h3,h4,h5,h6')];
      if (!headings.length) { outlineList.textContent = '此文档没有标题'; return; }
      headings.forEach(heading => {
        const button = document.createElement('button');
        button.textContent = heading.textContent;
        button.style.paddingLeft = (4 + (Number(heading.tagName[1]) - 1) * 12) + 'px';
        button.onclick = () => heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        outlineList.append(button);
      });
    }
    function drawPage() {
      page.innerHTML = tabs[active].html || emptyHTML();
      page.classList.toggle('blank', !tabs[active].html);
      titleName.textContent = tabs[active].name;
      filePath.textContent = tabs[active].path || '';
      filePath.hidden = !tabs[active].path;
      readingArea.style.setProperty('--path-height', tabs[active].path ? '26px' : '0px');
      sourceEditor.value = tabs[active].source;
      rebuildSourceMirror();
      documentScroll.scrollTop = 0;
      applyScriptFonts();
      drawOutline();
      updateSearch(false);
      positionReadingArea(true);
    }
    function newTab() { tabs.push({ name: '未命名', path: '', source: '', savedSource: '', html: '' }); active = tabs.length - 1; drawTabs(); drawPage(); }
    function redrawEditedPreview(tab) {
      tab.html = /\.txt$/i.test(tab.name) ? renderPlain(tab.source) : render(tab.source);
      if (tabs[active] !== tab) return;
      const oldY = documentScroll.scrollTop;
      page.innerHTML = tab.html || emptyHTML();
      page.classList.toggle('blank', !tab.html);
      applyScriptFonts();
      drawOutline();
      updateSearch(false);
      positionReadingArea(true);
      documentScroll.scrollTop = oldY;
    }
    sourceEditor.addEventListener('input', () => {
      const tab = tabs[active];
      tab.source = sourceEditor.value;
      rebuildSourceMirror();
      drawTabs();
      clearTimeout(renderTimer);
      renderTimer = setTimeout(() => redrawEditedPreview(tab), 180);
      clearTimeout(autoSaveTimers.get(tab));
      if (tab.path) autoSaveTimers.set(tab, setTimeout(() => {
        if (!tabs.includes(tab)) return;
        tab.savedSource = tab.source;
        drawTabs();
      }, 1000));
    });
    function setMode(next) {
      const previous = mode;
      if (previous === next) return;
      finishSplitResize();
      mode = next;
      cancelAnimationFrame(modeFrame);
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      modeTransitioning = !reduceMotion;
      readingArea.classList.toggle('transitioning', modeTransitioning);
      readingArea.classList.toggle('editing', mode === 'split');
      toggleMode.classList.toggle('editing-mode', mode === 'split');
      toggleMode.title = mode === 'split' ? '切换到阅读模式' : '切换到双栏编辑模式';
      toggleMode.setAttribute('aria-label', toggleMode.title);
      if (mode === 'split') {
        outlineBeforeEditing = targetInset !== 0;
        if (targetInset) toggleOutline.click();
      } else if (previous === 'split' && outlineBeforeEditing && !targetInset) toggleOutline.click();
      const start = visualModeProgress;
      const end = mode === 'split' ? 1 : 0;
      const started = performance.now();
      const frame = now => {
        const fraction = reduceMotion ? 1 : Math.min(1, (now - started) / 280);
        const eased = fraction < .5 ? 2 * fraction * fraction : 1 - Math.pow(-2 * fraction + 2, 2) / 2;
        visualModeProgress = start + (end - start) * eased;
        positionReadingArea();
        if (fraction < 1) { modeFrame = requestAnimationFrame(frame); return; }
        modeTransitioning = false;
        readingArea.classList.remove('transitioning');
        if (mode !== 'split') return;
        alignScroll(documentScroll, sourceEditor);
      };
      modeFrame = requestAnimationFrame(frame);
    }
    toggleMode.onclick = () => setMode(mode === 'reading' ? 'split' : 'reading');
    function setSplitRatio(value) {
      const width = Math.max(1, readingArea.clientWidth - 14);
      const sourceMinimum = Math.min(280, width * .45);
      const previewMinimum = Math.min(360, width * .45);
      splitRatio = Math.min(Math.max(value, sourceMinimum / width), 1 - previewMinimum / width);
      readingArea.style.setProperty('--split-left', `${splitRatio * width}px`);
      resizeSourceMirror();
      positionReadingArea();
    }
    splitDivider.addEventListener('pointerdown', event => {
      readingArea.classList.add('dragging');
      splitDivider.setPointerCapture(event.pointerId);
    });
    splitDivider.addEventListener('pointermove', event => {
      if (!splitDivider.hasPointerCapture(event.pointerId)) return;
      const left = readingArea.getBoundingClientRect().left;
      setSplitRatio((event.clientX - left) / Math.max(1, readingArea.clientWidth - 14));
    });
    splitDivider.addEventListener('pointerup', event => {
      splitDivider.releasePointerCapture(event.pointerId);
      finishSplitResize();
    });
    function finishSplitResize() {
      if (!readingArea.classList.contains('dragging')) return;
      readingArea.classList.remove('dragging');
      resizeSourceMirror();
      alignScroll(documentScroll, sourceEditor);
    }
    splitDivider.addEventListener('lostpointercapture', finishSplitResize);
    const suppressedScroll = new WeakMap();
    let pendingDriver;
    let syncScheduled = false;
    function resizeSourceMirror() {
      sourceMirror.style.width = Math.max(1, sourceEditor.clientWidth) + 'px';
    }
    function rebuildSourceMirror() {
      resizeSourceMirror();
      const fragment = document.createDocumentFragment();
      for (const line of sourceEditor.value.replace(/\r\n?/g, '\n').split('\n')) {
        const row = document.createElement('div');
        row.className = 'mirror-line';
        row.textContent = line || ' ';
        fragment.append(row);
      }
      sourceMirror.replaceChildren(fragment);
    }
    function scrollAnchors() {
      const previewRect = documentScroll.getBoundingClientRect();
      const sourceRows = sourceMirror.children;
      const points = [...page.querySelectorAll('[data-source-line]')].flatMap(node => {
        const line = Number(node.dataset.sourceLine);
        if (!Number.isInteger(line) || !sourceRows[line]) return [];
        const sourceY = sourceRows[line].offsetTop;
        const rect = node.getBoundingClientRect();
        const previewY = rect.top - previewRect.top + documentScroll.scrollTop;
        const end = Number(node.dataset.sourceEnd);
        const sourceEnd = sourceRows[end]?.offsetTop ?? sourceMirror.offsetHeight - 18;
        return Number.isInteger(end) ? [[sourceY, previewY], [sourceEnd, previewY + rect.height]] : [[sourceY, previewY]];
      }).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const merged = [];
      for (let index = 0; index < points.length;) {
        let end = index + 1;
        while (end < points.length && points[end][0] === points[index][0]) end++;
        merged.push([points[index][0], (points[index][1] + points[end - 1][1]) / 2]);
        index = end;
      }
      return merged;
    }
    function interpolate(position, points) {
      if (position <= points[0][0]) return points[0][1];
      for (let index = 1; index < points.length; index++) {
        if (position <= points[index][0]) {
          const left = points[index - 1], right = points[index];
          const fraction = (position - left[0]) / Math.max(1, right[0] - left[0]);
          return left[1] + fraction * (right[1] - left[1]);
        }
      }
      return points.at(-1)[1];
    }
    function alignScroll(from, to) {
      const sourceToPreview = from === sourceEditor;
      const raw = [[0, 0], ...scrollAnchors(), [sourceEditor.scrollHeight, documentScroll.scrollHeight]];
      const ordered = [];
      for (const point of raw) {
        const previous = ordered.at(-1);
        if (!previous || (point[0] > previous[0] && point[1] >= previous[1])) ordered.push(point);
      }
      const points = sourceToPreview ? ordered : ordered.map(([sourceY, previewY]) => [previewY, sourceY]);
      const maximum = Math.max(0, to.scrollHeight - to.clientHeight);
      const target = Math.min(maximum, Math.max(0, interpolate(from.scrollTop, points)));
      if (Math.abs(to.scrollTop - target) >= 1) {
        suppressedScroll.set(to, target);
        to.scrollTop = target;
      }
    }
    function scheduleScrollSync(driver, follower) {
      if (mode !== 'split' || modeTransitioning || readingArea.classList.contains('dragging')) return;
      const suppressedY = suppressedScroll.get(driver);
      if (suppressedY !== undefined && Math.abs(driver.scrollTop - suppressedY) < 2) {
        suppressedScroll.delete(driver); return;
      }
      pendingDriver = [driver, follower];
      if (syncScheduled) return;
      syncScheduled = true;
      requestAnimationFrame(() => {
        syncScheduled = false;
        const [from, to] = pendingDriver;
        alignScroll(from, to);
      });
    }
    sourceEditor.addEventListener('scroll', () => scheduleScrollSync(sourceEditor, documentScroll));
    documentScroll.addEventListener('scroll', () => scheduleScrollSync(documentScroll, sourceEditor));
    function showSearch() {
      searchBar.hidden = false;
      readingArea.style.setProperty('--search-height', '35px');
      searchInput.focus();
      searchInput.select();
      positionReadingArea(true);
    }
    function hideSearch() {
      searchBar.hidden = true;
      searchInput.value = '';
      readingArea.style.removeProperty('--search-height');
      updateSearch(false);
      positionReadingArea(true);
    }
    function updateSearch(jump = true) {
      page.querySelectorAll('.search-hit').forEach(node => node.classList.remove('search-hit'));
      hits = [];
      const needle = searchInput.value.trim().toLocaleLowerCase();
      if (needle) {
        page.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,tr,.plain-line').forEach(node => {
          const text = node.textContent.toLocaleLowerCase();
          let from = 0;
          while ((from = text.indexOf(needle, from)) !== -1) { hits.push(node); from += needle.length; }
        });
      }
      hitIndex = Math.min(hitIndex, Math.max(0, hits.length - 1));
      searchCount.textContent = hits.length ? `${hitIndex + 1}/${hits.length}` : '0/0';
      if (hits.length) {
        hits[hitIndex].classList.add('search-hit');
        if (jump) hits[hitIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
    function moveSearch(step) {
      if (!hits.length) return;
      hits[hitIndex].classList.remove('search-hit');
      hitIndex = (hitIndex + step + hits.length) % hits.length;
      searchCount.textContent = `${hitIndex + 1}/${hits.length}`;
      hits[hitIndex].classList.add('search-hit');
      hits[hitIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    searchInput.addEventListener('input', () => { hitIndex = 0; updateSearch(); });
    document.getElementById('previousHit').onclick = () => moveSearch(-1);
    document.getElementById('nextHit').onclick = () => moveSearch(1);
    document.getElementById('closeSearch').onclick = hideSearch;
    function setFont(n) { font = Math.max(12, Math.min(32, n)); page.style.fontSize = font + 'px'; }
    function textWidth(inset, width) { return Math.min(760, Math.max(1, width - inset - 60)); }
    function textX(inset, width) { return (width - inset - textWidth(inset, width)) / 2; }
    function positionReadingArea() {
      const sourceWidth = splitRatio * Math.max(1, readingArea.clientWidth - 14);
      const occupied = visualModeProgress * (sourceWidth + 14);
      readingArea.style.setProperty('--preview-left', `${occupied}px`);
      readingArea.style.setProperty('--preview-width', `${Math.max(1, readingArea.clientWidth - occupied)}px`);
      const width = documentScroll.clientWidth;
      page.style.width = textWidth(visualInset, width) + 'px';
      page.style.transform = `translateX(${textX(visualInset, width)}px)`;
      outline.style.transform = `translateX(${221 - visualInset}px)`;
    }
    toggleOutline.onclick = () => {
      cancelAnimationFrame(outlineFrame);
      targetInset = targetInset ? 0 : 221;
      readingArea.classList.toggle('collapsed', targetInset === 0);
      toggleOutline.setAttribute('aria-expanded', String(targetInset !== 0));
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const start = visualInset, end = targetInset, started = performance.now();
      const frame = now => {
        const fraction = reduceMotion ? 1 : Math.min(1, (now - started) / 280);
        const eased = fraction < .5 ? 2 * fraction * fraction : 1 - Math.pow(-2 * fraction + 2, 2) / 2;
        visualInset = start + (end - start) * eased;
        positionReadingArea();
        if (fraction < 1) outlineFrame = requestAnimationFrame(frame);
      };
      outlineFrame = requestAnimationFrame(frame);
    };
    new ResizeObserver(() => setSplitRatio(splitRatio)).observe(readingArea);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !searchBar.hidden) { hideSearch(); return; }
      if (!(e.metaKey || e.ctrlKey)) return;
      const key = e.key.toLowerCase();
      if (key === 't') { e.preventDefault(); newTab(); }
      if (key === 'o') { e.preventDefault(); fileInput.click(); }
      if (key === 'f') { e.preventDefault(); showSearch(); }
      if (key === 'e' && e.shiftKey) { e.preventDefault(); setMode(mode === 'reading' ? 'split' : 'reading'); }
      if (key === 's') { e.preventDefault(); alert('浏览器预览不会写回文件。请在 LightMD.app 中保存。'); }
      if (key === '+' || key === '=') { e.preventDefault(); setFont(font + 1); }
      if (key === '-') { e.preventDefault(); setFont(font - 1); }
      if (key === '0') { e.preventDefault(); setFont(16); }
    });
    function escapeHTML(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    function inline(s) { return escapeHTML(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/~~(.+?)~~/g, '<del>$1</del>').replace(/`(.+?)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>'); }
    function render(source) {
      const lines = source.replace(/\r\n?/g, '\n').split('\n');
      let out = '', paragraph = [], list = '', items = [], table = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        out += `<p data-source-line="${paragraph[0].line}" data-source-end="${paragraph.at(-1).line + 1}">${inline(paragraph.map(x => x.text).join(' '))}</p>`;
        paragraph = [];
      };
      const flushList = () => {
        if (!items.length) return;
        out += `<${list}>` + items.map(x => `<li data-source-line="${x.line}" data-source-end="${x.line + 1}">${inline(x.text)}</li>`).join('') + `</${list}>`;
        items = []; list = '';
      };
      const flushTable = () => {
        if (!table.length) return;
        const cells = value => value.slice(1, -1).split('|').map(x => x.trim());
        if (table.length > 1 && /^\|[\s:|-]+\|$/.test(table[1].text)) {
          const row = (item, tag) => `<tr data-source-line="${item.line}" data-source-end="${item.line + 1}">` + cells(item.text).map(x => `<${tag}>${inline(x)}</${tag}>`).join('') + '</tr>';
          out += '<table><thead>' + row(table[0], 'th') + '</thead><tbody>' + table.slice(2).map(x => row(x, 'td')).join('') + '</tbody></table>';
        } else out += `<pre data-source-line="${table[0].line}">` + escapeHTML(table.map(x => x.text).join('\n')) + '</pre>';
        table = [];
      };
      lines.forEach((line, lineIndex) => {
        const text = line.trim();
        if (!text) { flushParagraph(); flushList(); flushTable(); return; }
        if (text.startsWith('|') && text.endsWith('|')) { flushParagraph(); flushList(); table.push({ text, line: lineIndex }); return; }
        flushTable();
        const heading = text.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph(); flushList();
          const level = Math.min(heading[1].length, 3);
          const value = inline(heading[2]).replace(/^(\d+\.)\s*/, '<span class="heading-num">$1</span> ');
          out += `<h${level} data-source-line="${lineIndex}" data-source-end="${lineIndex + 1}">${value}</h${level}>`;
          return;
        }
        const item = text.match(/^(?:([-*+])|(\d+)\.)\s+(.+)$/);
        if (item) {
          flushParagraph();
          const type = item[2] ? 'ol' : 'ul';
          if (list && list !== type) flushList();
          list = type;
          items.push({ text: item[3], line: lineIndex });
          return;
        }
        flushList(); paragraph.push({ text, line: lineIndex });
      });
      flushParagraph(); flushList(); flushTable();
      return out || '<p>文件为空</p>';
    }
    function renderPlain(source) {
      return source.replace(/\r\n?/g, '\n').split('\n')
        .map((line, index) => `<div class="plain-line" data-source-line="${index}" data-source-end="${index + 1}">` + (line ? escapeHTML(line) : '&nbsp;') + '</div>').join('');
    }
    async function decodeFile(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      let encoding = 'utf-8'; let start = 0;
      if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) start = 3;
      else if (bytes[0] === 0xff && bytes[1] === 0xfe) { encoding = 'utf-16le'; start = 2; }
      else if (bytes[0] === 0xfe && bytes[1] === 0xff) { encoding = 'utf-16be'; start = 2; }
      else if (bytes.length >= 16 && bytes.length % 2 === 0) {
        const sample = bytes.slice(0, 512);
        let even = 0, odd = 0;
        sample.forEach((value, index) => { if (value === 0) index % 2 ? odd++ : even++; });
        if (odd > sample.length / 8 && even < sample.length / 16) encoding = 'utf-16le';
        if (even > sample.length / 8 && odd < sample.length / 16) encoding = 'utf-16be';
      }
      try { return new TextDecoder(encoding, { fatal: true }).decode(bytes.subarray(start)); }
      catch { return new TextDecoder('gb18030', { fatal: true }).decode(bytes); }
    }
    async function openFile(file) {
      if (!/\.(md|markdown|mdown|txt)$/i.test(file.name)) return;
      const key = [file.webkitRelativePath || file.name, file.size, file.lastModified].join(':');
      const existing = tabs.findIndex(tab => tab.fileKey === key);
      if (existing !== -1) { active = existing; drawTabs(); drawPage(); return; }
      try {
        const content = await decodeFile(file);
        const tab = { name: file.name, path: file.webkitRelativePath || file.name, source: content, savedSource: content,
                      fileKey: key, html: /\.txt$/i.test(file.name) ? renderPlain(content) : render(content) };
        if (tabs[active].name === '未命名' && tabs[active].source === '') tabs[active] = tab;
        else { tabs.push(tab); active = tabs.length - 1; }
        drawTabs(); drawPage();
      } catch { alert('无法识别文件编码'); }
    }
    fileInput.onchange = async e => {
      for (const file of e.target.files) await openFile(file);
      fileInput.value = '';
    };
    document.addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault(); });
    document.addEventListener('drop', async e => {
      if (!e.dataTransfer?.files.length) return;
      e.preventDefault();
      for (const file of e.dataTransfer.files) await openFile(file);
    });
    function slug(value) {
      return value.toLocaleLowerCase().replace(/[^\p{L}\p{N}_\-\s]/gu, '').trim().replace(/\s+/g, '-');
    }
    page.addEventListener('click', e => {
      const link = e.target.closest('a'); if (!link) return;
      const href = link.getAttribute('href') || '';
      if (href === '#' || (!/^[a-z]+:/i.test(href) && !href.startsWith('#'))) {
        e.preventDefault(); return;
      }
      if (href.startsWith('#')) {
        e.preventDefault();
        const target = decodeURIComponent(href.slice(1));
        const heading = [...page.querySelectorAll('h1,h2,h3,h4,h5,h6')]
          .find(node => slug(node.textContent) === target || node.textContent === target);
        heading?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    drawTabs(); drawPage();
  </script>
</body>
</html>
